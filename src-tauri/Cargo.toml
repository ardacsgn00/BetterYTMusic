[package]
name = "betterytmusic"
version = "0.23.0"
description = "Lightweight YouTube Music desktop client"
authors = ["Arda Coşgun <https://github.com/ardacsgn00>"]
repository = "https://github.com/ardacsgn00/betterytmusic"
edition = "2021"
rust-version = "1.77"

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows.
name = "betterytmusic_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "gzip"] }
sha1 = "0.10"
rodio = { version = "0.20", default-features = false, features = ["symphonia-aac", "symphonia-isomp4", "symphonia-mp3"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3"] }
souvlaki = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

